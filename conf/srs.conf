# SRS (Simple Realtime Server) Configuration
# Supports: RTMP ingest, HLS/HTTP-FLV playback, DVR recording, HTTP callbacks

listen              1935;
max_connections     1000;
srs_log_tank        file;
srs_log_file        ./objs/srs.log;
srs_log_level       warn;
daemon              off;
pid                 ./objs/srs.pid;

# HTTP API (management, stats, console)
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
    raw_api {
        enabled             on;
        allow_reload        on;
        allow_query         on;
        allow_update        on;
    }
}

# HTTP server (HLS, HTTP-FLV, WebRTC, console)
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

# System stats
stats {
    network         0;
}

# WebRTC
rtc_server {
    enabled         on;
    listen          8000;   # UDP
    candidate       $CANDIDATE;
}

# ─── Default vhost ──────────────────────────────────────────────────────────────
vhost __defaultVhost__ {

    # ── HTTP callbacks ──────────────────────────────────────────────────────────
    http_hooks {
        enabled         on;
        on_connect      http://hooks:5000/on_connect;
        on_close        http://hooks:5000/on_close;
        on_publish      http://hooks:5000/on_publish;
        on_unpublish    http://hooks:5000/on_unpublish;
        on_play         http://hooks:5000/on_play;
        on_stop         http://hooks:5000/on_stop;
        on_dvr          http://hooks:5000/on_dvr;
    }

    # ── HLS output ──────────────────────────────────────────────────────────────
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    10;
        hls_window      60;
        hls_on_error    continue;
        hls_cleanup     on;
        hls_dispose     30;
    }

    # ── HTTP-FLV live stream ─────────────────────────────────────────────────────
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
        hstrs       on;
    }

    # ── DVR recording ────────────────────────────────────────────────────────────
    dvr {
        enabled             on;
        dvr_path            ./dvr/[app]/[stream].[timestamp].flv;
        dvr_plan            session;
        dvr_duration        0;
        dvr_wait_keyframe   on;
    }

    # ── Ingest / transcode (optional FFmpeg pipeline) ────────────────────────────
    # Uncomment to enable server-side transcoding
    # transcode {
    #     enabled     on;
    #     ffmpeg      /usr/local/bin/ffmpeg;
    #     engine hd {
    #         enabled         on;
    #         vfilter {
    #             vf          scale=1280:720;
    #         }
    #         vcodec          libx264;
    #         vbitrate        1500;
    #         vfps            30;
    #         vwidth          1280;
    #         vheight         720;
    #         vthreads        4;
    #         vprofile        main;
    #         vpreset         medium;
    #         acodec          libfdk_aac;
    #         abitrate        128;
    #         asample         44100;
    #         achannels       2;
    #         output          rtmp://127.0.0.1:[port]/[app]/[stream]_720p;
    #     }
    # }

    # ── Bandwidth / connection limits ────────────────────────────────────────────
    publish {
        mr          off;
    }

    play {
        gop_cache   on;
        queue_length 10;
        mw_latency  350;
    }
}
